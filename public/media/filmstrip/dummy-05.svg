<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#1c1512"/>
      <stop offset="0.55" stop-color="#553327"/>
      <stop offset="1" stop-color="#8d5a3d"/>
    </linearGradient>
    <radialGradient id="window" cx="0.72" cy="0.18" r="0.4">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#room)"/>
  <rect width="1600" height="900" fill="url(#window)"/>

  <g fill="#241611" opacity="0.85">
    <rect x="60" y="120" width="240" height="300" rx="6"/>
    <rect x="340" y="120" width="240" height="300" rx="6"/>
    <rect x="1200" y="100" width="320" height="340" rx="6"/>
  </g>

  <g fill="#0e0907">
    <rect x="120" y="640" width="1360" height="30" rx="8"/>
    <g transform="translate(200 520)">
      <circle cx="50" cy="36" r="30"/>
      <path d="M4 80 Q50 50 96 80 L118 200 H-18 Z"/>
    </g>
    <rect x="120" y="712" width="164" height="42" rx="12"/>
    <rect x="130" y="754" width="12" height="110"/>
    <rect x="260" y="754" width="12" height="110"/>
    <g transform="translate(470 520)">
      <circle cx="50" cy="36" r="30"/>
      <path d="M4 80 Q50 50 96 80 L118 200 H-18 Z"/>
    </g>
    <rect x="390" y="712" width="164" height="42" rx="12"/>
    <rect x="400" y="754" width="12" height="110"/>
    <rect x="530" y="754" width="12" height="110"/>
    <g transform="translate(740 520)">
      <circle cx="50" cy="36" r="30"/>
      <path d="M4 80 Q50 50 96 80 L118 200 H-18 Z"/>
    </g>
    <rect x="660" y="712" width="164" height="42" rx="12"/>
    <rect x="670" y="754" width="12" height="110"/>
    <rect x="800" y="754" width="12" height="110"/>
    <g transform="translate(1010 520)">
      <circle cx="50" cy="36" r="30"/>
      <path d="M4 80 Q50 50 96 80 L118 200 H-18 Z"/>
    </g>
    <rect x="930" y="712" width="164" height="42" rx="12"/>
    <rect x="940" y="754" width="12" height="110"/>
    <rect x="1070" y="754" width="12" height="110"/>
  </g>

  <g fill="#d92b35" opacity="0.9">
    <rect x="330" y="470" width="26" height="78" rx="4"/>
