<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#171214"/>
      <stop offset="0.45" stop-color="#4a2c22"/>
      <stop offset="1" stop-color="#a5613a"/>
    </linearGradient>
    <radialGradient id="smoke" cx="0.35" cy="0.42" r="0.42">
      <stop offset="0" stop-color="#e6b27a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e6b27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.64"/>
    </radialGradient>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#smoke)"/>

  <g fill="#d9a06a" opacity="0.35" filter="url(#haze)">
    <circle cx="420" cy="390" r="190"/>
    <circle cx="640" cy="330" r="150"/>
    <circle cx="230" cy="470" r="130"/>
  </g>

  <g fill="#0a0706" filter="url(#soft)">
    <path d="M-60 700 L240 520 L540 700 Z" opacity="0.5"/>
    <path d="M1080 710 L1360 520 L1660 710 Z" opacity="0.5"/>
  </g>

  <g fill="#050403">
    <g transform="translate(420 520)">
      <circle cx="42" cy="30" r="26"/>
      <path d="M0 70 Q42 42 84 70 L104 270 H-20 Z"/>
      <path d="M94 60 L260 30 L270 60 L104 96 Z"/>
    </g>
    <g transform="translate(680 500)">
      <circle cx="42" cy="30" r="26"/>
      <path d="M0 70 Q42 42 84 70 L104 290 H-20 Z"/>
      <path d="M-10 60 L-180 26 L-190 58 L-8 96 Z"/>
    </g>
    <g transform="translate(940 536)">
      <circle cx="40" cy="28" r="24"/>
      <path d="M2 66 Q40 40 78 66 L98 274 H-16 Z"/>
    </g>
    <rect x="530" y="560" width="330" height="26" rx="10"/>
    <rect x="516" y="586" width="18" height="150"/>
    <rect x="850" y="586" width="18" height="150"/>
    <rect x="560" y="530" width="270" height="26" rx="12" transform="rotate(-9 560 530)"/>
  </g>

  <g fill="#ff7433" opacity="0.55" filter="url(#soft)">
    <circle cx="1200" cy="660" r="34"/>
    <circle cx="1260" cy="640" r="20"/>
    <circle cx="320" cy="700" r="26"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.6"/>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
