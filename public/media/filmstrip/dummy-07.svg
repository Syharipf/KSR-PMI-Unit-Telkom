<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#141018"/>
      <stop offset="0.5" stop-color="#463049"/>
      <stop offset="1" stop-color="#a06b63"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.34" r="0.5">
      <stop offset="0" stop-color="#ffd0a4" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffd0a4" stop-opacity="0"/>
