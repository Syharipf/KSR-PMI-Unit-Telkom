      <circle cx="44" cy="32" r="26"/>
      <path d="M2 72 Q44 44 86 72 L108 300 H-16 Z"/>
    </g>
    <g transform="translate(430 570)">
      <circle cx="40" cy="30" r="24"/>
      <path d="M4 68 Q40 42 76 68 L96 280 H-14 Z"/>
    </g>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.55"/>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
