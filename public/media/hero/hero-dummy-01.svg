<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#170c0b"/>
      <stop offset="0.42" stop-color="#401411"/>
      <stop offset="0.78" stop-color="#7c2619"/>
      <stop offset="1" stop-color="#a63a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.26" r="0.62">
      <stop offset="0" stop-color="#ffc07a" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#ff9d52" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff9d52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    <filter id="bokeh" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="far" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.14"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g filter="url(#bokeh)" opacity="0.55">
    <circle cx="1160" cy="200" r="120" fill="#ffd39a"/>
    <circle cx="1340" cy="320" r="78" fill="#ffc07a"/>
    <circle cx="985" cy="150" r="56" fill="#ffe3bd"/>
  </g>

  <g fill="#150a09" opacity="0.55" filter="url(#far)">
    <circle cx="520" cy="520" r="34"/>
    <path d="M470 552 q50 -32 100 0 l22 220 h-145 z"/>
    <circle cx="700" cy="500" r="30"/>
    <path d="M650 528 q50 -28 100 0 l18 232 h-136 z"/>
    <circle cx="910" cy="512" r="32"/>
    <path d="M860 542 q50 -30 100 0 l20 224 h-140 z"/>
    <circle cx="1090" cy="530" r="30"/>
    <path d="M1040 560 q50 -30 100 0 l18 214 h-136 z"/>
  </g>

  <g fill="#0f0706" filter="url(#soft)">
    <g transform="translate(150 560) rotate(-4 110 200)">
      <circle cx="72" cy="54" r="40"/>
      <path d="M8 112 Q72 68 136 112 L162 440 H-18 Z"/>
    </g>
    <g transform="translate(1260 528) rotate(3 110 210)">
      <circle cx="72" cy="50" r="37"/>
      <path d="M10 104 Q72 64 134 104 L160 456 H-16 Z"/>
    </g>
    <rect x="300" y="704" width="1000" height="22" rx="9"/>
    <rect x="352" y="726" width="26" height="174"/>
    <rect x="1222" y="726" width="26" height="174"/>
    <rect x="470" y="640" width="120" height="64" rx="10" opacity="0.9"/>
    <rect x="1070" y="632" width="92" height="72" rx="10" opacity="0.9"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.55"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
