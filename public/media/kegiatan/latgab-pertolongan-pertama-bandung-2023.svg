  <!-- Headline & Location at bottom -->
  <text x="100" y="750" font-family="sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Latgab Pertolongan Pertama Bandung Raya</text>
  <text x="100" y="800" font-family="monospace" font-size="20" font-weight="500" fill="rgba(255,255,255,0.6)">Markas PMI Kabupaten Bandung · KSR PMI Unit Telkom</text>
