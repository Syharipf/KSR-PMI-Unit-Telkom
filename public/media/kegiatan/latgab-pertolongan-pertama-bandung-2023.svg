      <stop offset="0%" stop-color="#2d1e08"/>
      <stop offset="100%" stop-color="#140c02"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#grad_latgab-pertolongan-pertama-bandung-2023)"/>
