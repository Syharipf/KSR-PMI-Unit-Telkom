<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="grad_siaga-medis-wisuda-periode-1-2024" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#grad_siaga-medis-wisuda-periode-1-2024)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Center Decorative Glow -->
  <circle cx="800" cy="480" r="260" fill="#c51d24" opacity="0.12" filter="blur(40px)"/>

  <!-- Icon Graphic -->
  <g>
    <path d="M800 370 v160 M720 450 h160" stroke="#c51d24" stroke-width="44" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Badge Tag -->
  <rect x="100" y="100" width="194" height="42" rx="21" fill="#c51d24" opacity="0.2" stroke="#c51d24" stroke-width="1.5"/>
  <text x="120" y="127" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c51d24" letter-spacing="2">SIAGA MEDIS</text>

  <!-- Headline & Location at bottom -->
  <text x="100" y="750" font-family="sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Wisuda Periode I Tahun 2024</text>
  <text x="100" y="800" font-family="monospace" font-size="20" font-weight="500" fill="rgba(255,255,255,0.6)">Telkom University Convention Hall · KSR PMI Unit Telkom</text>
</svg>